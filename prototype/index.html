<title>Mise Cook-Along</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: kitchen-counter app. Search hero with a live demo stage, a recipe sheet, then a cook-along screen: animated stage | step card + timer | "up next" rail */
:root{
  --bg:#EEF1EB; --surface:#FFFFFF; --surface-2:#F6F8F3; --ink:#17201B; --muted:#55625A; --line:#D7DED3;
  --accent:#F2B12E; --accent-ink:#2A1D00; --accent-soft:#FBEBC4;
  --basil:#2D6A4B; --basil-soft:#DCECE2; --tomato:#C2412A; --tomato-soft:#F7DED7;
  --stage:#E2E8DC; --board:#E2C497; --board-edge:#C6A170; --grain:#D2AE7B;
  --steel:#CED6DA; --steel-2:#95A2A9; --handle:#3B2A1F; --stove:#29302C; --stove-2:#47504B;
  --pot:#4A5652; --pot-2:#6C7974; --pot-rim:#2E3834; --bowl:#F8F5EF; --bowl-2:#D8D1C4;
  --plate:#FBFAF6; --plate-2:#DEDAD0; --steam:rgba(98,116,106,.5); --shadow:rgba(23,32,27,.13);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1411; --surface:#18201B; --surface-2:#131A16; --ink:#E7EDE8; --muted:#98A69E; --line:#29332D;
  --accent:#F2B12E; --accent-ink:#221700; --accent-soft:#3A2D10;
  --basil:#76C79C; --basil-soft:#1B3326; --tomato:#F0866A; --tomato-soft:#3C201A;
  --stage:#19221D; --board:#B78C5B; --board-edge:#94703F; --grain:#A47C4D;
  --steel:#B9C3C8; --steel-2:#7F8C93; --handle:#2A1D15; --stove:#0A0D0B; --stove-2:#2B322E;
  --pot:#56635E; --pot-2:#71807A; --pot-rim:#353F3B; --bowl:#E7E2D8; --bowl-2:#B9B2A4;
  --plate:#EAE6DD; --plate-2:#C5C0B4; --steam:rgba(235,242,238,.42); --shadow:rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#18201B; --surface-2:#131A16; --ink:#E7EDE8; --muted:#98A69E; --line:#29332D;
  --accent:#F2B12E; --accent-ink:#221700; --accent-soft:#3A2D10;
  --basil:#76C79C; --basil-soft:#1B3326; --tomato:#F0866A; --tomato-soft:#3C201A;
  --stage:#19221D; --board:#B78C5B; --board-edge:#94703F; --grain:#A47C4D;
  --steel:#B9C3C8; --steel-2:#7F8C93; --handle:#2A1D15; --stove:#0A0D0B; --stove-2:#2B322E;
  --pot:#56635E; --pot-2:#71807A; --pot-rim:#353F3B; --bowl:#E7E2D8; --bowl-2:#B9B2A4;
  --plate:#EAE6DD; --plate-2:#C5C0B4; --steam:rgba(235,242,238,.42); --shadow:rgba(0,0,0,.45);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand svg{width:34px;height:34px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:-.02em}
.brand small{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:700;min-height:46px;transition:transform .12s,border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05);border-color:var(--accent-ink)}
.btn.big{min-height:58px;padding:14px 26px;font-size:1.12rem;border-radius:16px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line)}
.btn svg{width:20px;height:20px;flex:none}

/* ---------- HOME ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center;padding-block:24px 40px}
.hero h1{font-size:clamp(2.6rem,6.2vw,4.9rem);font-weight:800;letter-spacing:-.035em;margin:12px 0 22px}
.hero h1 em{font-style:normal;color:var(--basil)}
.search{position:relative}
.search-box{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:0 10px 0 18px;min-height:66px;box-shadow:0 18px 40px -22px var(--shadow);transition:border-color .15s}
.search-box:focus-within{border-color:var(--ink)}
.search-box svg{width:24px;height:24px;color:var(--muted);flex:none}
.search-box input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1.2rem;color:var(--ink);padding:14px 0;outline:none}
.search-box input::placeholder{color:var(--muted)}
.search-box input::-webkit-search-cancel-button{display:none}
.kbd{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:30;margin:0;padding:6px;list-style:none;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 24px 50px -20px var(--shadow);max-height:min(420px,60vh);overflow:auto}
.opt{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;cursor:pointer}
.opt svg{width:44px;height:44px;display:block}
.opt[aria-selected="true"]{background:var(--accent-soft)}
.opt-name{font-weight:700;font-size:1.05rem;display:block}
.opt-name mark{background:none;color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:3px}
.opt-meta{font-size:.84rem;color:var(--muted);display:block}
.opt-why{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--basil);background:var(--basil-soft);padding:3px 8px;border-radius:99px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.sugg-empty{padding:14px 12px;color:var(--muted)}
.sugg-empty b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.chips span{font-size:.88rem;color:var(--muted);margin-right:2px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:6px 14px;font-size:.92rem}
.chip:hover{border-color:var(--ink)}
.demo{position:relative}
.demo .stage{box-shadow:0 30px 60px -36px var(--shadow)}
.demo-cap{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:.9rem;color:var(--muted)}
.demo-cap b{color:var(--ink)}

.section-h{display:flex;align-items:baseline;gap:10px;font-size:1.55rem;margin:8px 0 16px}
.section-h span{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-bottom:56px}
.card{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.card svg{width:76px;height:76px;display:block}
.card h3{font-size:1.18rem;font-weight:700;margin-bottom:4px}
.card p{margin:0;font-size:.86rem;color:var(--muted)}

/* ---------- STAGE (shared) ---------- */
.stage{position:relative;background:var(--stage);border-radius:24px;aspect-ratio:400/280;width:100%;max-width:100%;overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage-cap{position:absolute;left:14px;top:14px;z-index:2;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:99px;box-shadow:0 4px 14px -6px var(--shadow)}
.stage-cap:empty{display:none}

/* ---------- RECIPE ---------- */
.back{margin:4px 0 14px -8px}
.rhead{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:40px;align-items:center;padding-bottom:34px}
.rhead h1{font-size:clamp(2.3rem,5vw,4rem);font-weight:800;letter-spacing:-.03em;margin:10px 0 12px}
.lede{font-size:1.15rem;color:var(--muted);max-width:52ch;margin:0 0 22px}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;margin:0 0 26px;padding:0}
.facts div{display:flex;flex-direction:column}
.facts dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.rbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;padding-bottom:60px;align-items:start}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel h2{font-size:1.4rem}
.stepper{display:flex;align-items:center;gap:4px;border:1.5px solid var(--line);border-radius:12px;padding:3px}
.stepper button{width:34px;height:34px;border:0;border-radius:9px;background:var(--surface-2);font-size:1.2rem;line-height:1}
.stepper button:hover{background:var(--accent-soft)}
.stepper output{min-width:96px;text-align:center;font-weight:700;font-size:.95rem}
.ing{list-style:none;margin:0;padding:0}
.ing li+li{border-top:1px dashed var(--line)}
.ing label{display:grid;grid-template-columns:22px 92px minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 2px;cursor:pointer}
.ing input{appearance:none;width:20px;height:20px;border:2px solid var(--steel-2);border-radius:6px;margin:0;align-self:center;display:grid;place-items:center;background:var(--surface)}
.ing input:checked{background:var(--basil);border-color:var(--basil)}
.ing input:checked::after{content:"";width:5px;height:10px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.ing .q{font-family:var(--f-mono);font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums}
.ing .n small{color:var(--muted);font-size:.86rem}
.ing input:checked ~ span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--steel-2)}
.equip{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px;padding:0;list-style:none}
.equip li{font-size:.9rem;border:1.5px solid var(--line);border-radius:99px;padding:4px 12px}
.overview h3{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;display:flex;justify-content:space-between}
.overview ol{margin:0;padding:0;list-style:none;counter-reset:none}
.overview li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:7px 0;align-items:baseline}
.overview li .num{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.overview li .dur{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- COOK ---------- */
.cook-top{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.cook-top .ttl{flex:1;min-width:0}
.cook-top .ttl b{font-family:var(--f-display);font-size:1.3rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cook-top .ttl span{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.icon-btn{width:46px;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.switch{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted);cursor:pointer;user-select:none}
.switch input{appearance:none;width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 3px var(--shadow)}
.switch input:checked{background:var(--basil)}
.switch input:checked::after{transform:translateX(16px)}

.prog{display:flex;gap:10px;margin-bottom:18px}
.prog-g{display:flex;flex-direction:column;gap:5px;min-width:0}
.prog-g small{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden}
.prog-g.on small{color:var(--ink);font-weight:700}
.prog-s{display:flex;gap:3px}
.prog-s i{flex:1;height:7px;border-radius:4px;background:var(--line);transition:background .3s}
.prog-s i.done{background:var(--ph)}
.prog-s i.cur{background:var(--ph);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ph)}
.ph-prep{--ph:var(--basil)} .ph-mix{--ph:var(--basil)} .ph-cook{--ph:var(--accent)} .ph-serve{--ph:var(--tomato)}

.cook-body{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 250px;gap:22px;align-items:start;padding-bottom:40px}
.stage-col{position:sticky;top:12px}
.step-col{display:flex;flex-direction:column;gap:16px;min-width:0}
.step-card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px}
.step-card.enter{animation:rise .38s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(18px);opacity:.2}to{transform:none;opacity:1}}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--ph);color:var(--surface)}
.ph-cook .pill,.pill.ph-cook{color:var(--accent-ink)}
.step-card h2{font-size:clamp(1.6rem,2.7vw,2.25rem);font-weight:700;letter-spacing:-.02em;margin:12px 0 10px}
.step-card p.d{font-size:1.16rem;margin:0;max-width:60ch}
.tip{margin-top:16px;background:var(--basil-soft);border-radius:14px;padding:12px 14px;font-size:.98rem}
.tip b{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--basil);display:block;margin-bottom:2px}

.timer{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;align-items:center}
.timer.none{grid-template-columns:1fr;padding:16px 20px;color:var(--muted)}
.timer.none b{color:var(--ink)}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--line);stroke-width:10}
.ring .fg{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .3s linear,stroke .2s}
.timer.done .ring .fg{stroke:var(--basil)}
.ring-read{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-read b{font-family:var(--f-mono);font-size:1.75rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring-read small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.t-side{display:flex;flex-direction:column;gap:10px;min-width:0}
.t-status{font-size:.95rem;color:var(--muted);margin:0}
.t-status b{color:var(--ink)}
.timer.done .t-status b{color:var(--basil)}
.t-btns{display:flex;flex-wrap:wrap;gap:8px}
.t-btns .btn{min-height:42px;padding:8px 14px}
.timer.running .ring-read b{color:var(--ink)}
.timer.done{border-color:var(--basil)}
.navrow{display:flex;gap:10px}
.navrow .primary{flex:1}

.rail-wrap{position:sticky;top:12px}
.rail-wrap h3{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:2px 0 10px;font-weight:500}
.rail{list-style:none;margin:0;padding:0 4px 0 0;max-height:calc(100vh - 170px);overflow:auto;position:relative;scroll-behavior:smooth}
.rail button{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-radius:12px;padding:8px}
.rail button:hover{background:var(--surface)}
.rail .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;border:1.5px solid var(--line);color:var(--muted)}
.rail .t{font-size:.92rem;line-height:1.25;color:var(--muted)}
.rail .tm{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rail li.done .n{background:var(--line);border-color:var(--line)}
.rail li.cur button{background:var(--surface)}
.rail li.cur .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.rail li.cur .t{color:var(--ink);font-weight:700}
.rail li.run .tm{color:var(--ink);font-weight:700}
.rail li.run .tm::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--tomato);margin-right:5px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:50;max-width:calc(100% - 32px);box-shadow:0 18px 40px -16px var(--shadow)}

/* done */
.done-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:30px 60px}
.done-wrap h1{font-size:clamp(2.4rem,5vw,4rem);font-weight:800;letter-spacing:-.03em;margin:10px 0 14px}
.done-wrap p{font-size:1.15rem;color:var(--muted);margin:0 0 24px}
.row{display:flex;flex-wrap:wrap;gap:10px}

@media (max-width:1100px){
  .cook-body{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
  .rail-wrap{grid-column:1/-1;position:static}
  .rail{max-height:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px 12px}
}
@media (max-width:900px){
  .hero,.rhead,.rbody,.done-wrap{grid-template-columns:1fr}
  .hero{gap:28px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rhead{gap:22px}
}
@media (max-width:760px){
  .cook-body{grid-template-columns:1fr;gap:16px}
  .stage-col{position:static}
  .navrow{position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);z-index:5}
  .switch span{display:none}
}
@media (max-width:600px){
  .grid{grid-template-columns:1fr}
  .timer{grid-template-columns:104px minmax(0,1fr);gap:14px;padding:14px}
  .ring{width:104px;height:104px}
  .ring-read b{font-size:1.4rem}
  .ing label{grid-template-columns:22px 74px minmax(0,1fr)}
  .opt{grid-template-columns:40px minmax(0,1fr)}
  .opt-why{display:none}
  .kbd{display:none}
}
@media (prefers-reduced-motion: reduce){
  .step-card.enter{animation:none}
  .rail{scroll-behavior:auto}
  *{transition:none!important}
}

function steam(S,x,y,n,o){let s='';for(let i=0;i<n;i++){const xx=x+(i-(n-1)/2)*22+rnd(-4,4);s+=`<path ${S.a([{transform:'translateY(0px)',opacity:0},{transform:'translateY(-14px)',opacity:o,offset:.35},{transform:'translateY(-46px)',opacity:0}],{duration:rnd(2300,3100),delay:i*620,easing:'linear'})} d="M${xx.toFixed(1)} ${y}c-8 -10 8 -20 0 -30c-8 -10 8 -20 0 -30" stroke="var(--steam)" stroke-width="4.5" fill="none" stroke-linecap="round"/>`}return s}

function shaker(S,R){const px=R.cx+74,py=R.cy-112;let parts='';const cols=['#3B2A1F','#B33A22','#F5F1E6','#3B2A1F'];

  const svg=el.querySelector('svg'),anims=[];
  for(const sp of S.specs){const node=svg.querySelector(`[data-k="${sp.k}"]`);if(!node)continue;if(sp.origin)node.style.transformOrigin=sp.origin;

$('#count').textContent=RECIPES.length;
grid.innerHTML=RECIPES.map(r=>`<button class="card" data-id="${r.id}">${miniPlate(r.colors)}<span><h3>${esc(r.name)}</h3><p>${esc(r.cuisine)} · ${dur(total(r))} · ${r.steps.length} steps</p></span></button>`).join('');

['jollof','eggs','pasta','avocado','plantain'].forEach(t=>{const b=document.createElement('button');b.className='chip';b.textContent=t;b.onclick=()=>{q.value=t;q.focus();suggest()};$('#chips').appendChild(b)});

const q=$('#q'),sugg=$('#sugg');let results=[],active=-1;
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function match(r,qq){const name=r.name.toLowerCase(),words=name.split(/\s+/);
  if(name.startsWith(qq))return{s:100};if(words.some(w=>w.startsWith(qq)))return{s:88};if(name.includes(qq))return{s:75};
  if(r.cuisine.toLowerCase().startsWith(qq))return{s:55,why:r.cuisine};
  const ws=t=>t.toLowerCase().split(/[\s-]+/),stem=qq.length>3?qq.replace(/e?s$/,''):qq,hit=t=>ws(t).some(w=>w.startsWith(qq)||w.startsWith(stem))||(qq.includes(' ')&&t.toLowerCase().includes(qq));
  const tag=r.tags.find(hit);if(tag)return{s:50,why:tag};
  const ing=r.ing.find(i=>hit(i[2]));if(ing)return{s:40,why:'uses '+ing[2]};
  if(qq.length>=4&&words.some(w=>lev(qq,w.slice(0,qq.length))<=1))return{s:30,why:'close match'};
  return null}
function hl(name,qq){const i=name.toLowerCase().indexOf(qq);return i<0?esc(name):esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+qq.length))+'</mark>'+esc(name.slice(i+qq.length))}
function suggest(){const qq=q.value.trim().toLowerCase();active=-1;
  if(!qq){sugg.hidden=true;q.setAttribute('aria-expanded','false');return}
  results=RECIPES.map(r=>({r,m:match(r,qq)})).filter(x=>x.m).sort((a,b)=>b.m.s-a.m.s).slice(0,6);
  if(!results.length){sugg.innerHTML=`<li class="sugg-empty">No recipe for <b>“${esc(q.value.trim())}”</b> yet. Try ${RECIPES.slice(0,3).map(r=>esc(r.name)).join(', ')}…</li>`}
  else sugg.innerHTML=results.map((x,i)=>`<li class="opt" role="option" id="opt${i}" aria-selected="false" data-id="${x.r.id}">${miniPlate(x.r.colors)}<span><span class="opt-name">${hl(x.r.name,qq)}</span><span class="opt-meta">${esc(x.r.cuisine)} · ${dur(total(x.r))} · ${x.r.steps.length} steps</span></span>${x.m.why?`<span class="opt-why">${esc(x.m.why)}</span>`:'<span></span>'}</li>`).join('');
  sugg.hidden=false;q.setAttribute('aria-expanded','true');if(results.length)setActive(0)}
function setActive(i){active=i;sugg.querySelectorAll('.opt').forEach((o,k)=>o.setAttribute('aria-selected',k===i?'true':'false'));const o=$('#opt'+i);if(o){q.setAttribute('aria-activedescendant','opt'+i);o.scrollIntoView({block:'nearest'})}}
q.addEventListener('input',suggest);
q.addEventListener('focus',()=>{if(q.value.trim())suggest()});
q.addEventListener('keydown',e=>{if(sugg.hidden)return;
  if(e.key==='ArrowDown'){e.preventDefault();if(results.length)setActive((active+1)%results.length)}
  else if(e.key==='ArrowUp'){e.preventDefault();if(results.length)setActive((active-1+results.length)%results.length)}
  else if(e.key==='Enter'){e.preventDefault();const x=results[active<0?0:active];if(x)openRecipe(x.r.id)}
  else if(e.key==='Escape'){sugg.hidden=true;q.setAttribute('aria-expanded','false')}});
sugg.addEventListener('mousedown',e=>{const o=e.target.closest('.opt');if(o){e.preventDefault();openRecipe(o.dataset.id)}});
document.addEventListener('click',e=>{if(!e.target.closest('#searchWrap')){sugg.hidden=true;q.setAttribute('aria-expanded','false')}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!$('#home').hidden&&document.activeElement!==q){e.preventDefault();q.focus()}});

/* ================= VIEWS ================= */
let stopDemo=null,stopArt=null,stopStage=null,stopDone=null;
function show(id){['home','recipe','cook','done'].forEach(v=>$('#'+v).hidden=v!==id);window.scrollTo(0,0);
  if(id==='home'){stopDemo&&stopDemo();stopDemo=renderScene($('#demoStage'),{k:'cut',item:'tomato',style:'dice'})}else{stopDemo&&stopDemo();stopDemo=null}
  if(id!=='recipe'&&stopArt){stopArt();stopArt=null}
  if(id!=='cook'){stopStage&&stopStage();stopStage=null;releaseWake()}
  if(id!=='done'&&stopDone){stopDone();stopDone=null}}
$('#brandBtn').onclick=()=>{leaveCook();show('home')};

const st={r:null,serv:4,i:0,timers:{},checked:new Set(),adv:null};
function fmtQty(q,unit){if(q==null)return '';let v=q*st.serv/st.r.serves;
  if(unit==='g'||unit==='ml'){v=v>=100?Math.round(v/10)*10:Math.round(v/5)*5;return v+' '+unit}
  if(unit==='kg')return (Math.round(v*100)/100)+' kg';
  const F=[[0,''],[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];let w=Math.floor(v+1e-6),fr=v-w,best=F[0];for(const f of F)if(Math.abs(fr-f[0])<Math.abs(fr-best[0]))best=f;if(best[0]===1)w++;
  let s=(w||'')+best[1];if(!s)s='⅛';
  const sing={cups:'cup',cloves:'clove'},plur={cup:'cups',clove:'cloves'};let u=unit;if(u){if(v<=1&&sing[u])u=sing[u];if(v>1&&plur[u])u=plur[u]}
  return s+(u?' '+u:'')}
function openRecipe(id){const r=RECIPES.find(x=>x.id===id);if(!r)return;st.r=r;st.serv=r.serves;st.checked=new Set();sugg.hidden=true;renderRecipe();show('recipe');
  stopArt&&stopArt();stopArt=renderScene($('#rArt'),r.steps[r.steps.length-1].v)}
function renderRecipe(){const r=st.r,el=$('#recipe');
  const phases=[...new Set(r.steps.map(s=>s.p))];
  const prep=r.steps.filter(s=>s.p==='prep'||s.p==='mix').reduce((a,s)=>a+s.s,0),cook=r.steps.filter(s=>s.p==='cook'||s.p==='serve').reduce((a,s)=>a+s.s,0);
  el.innerHTML=`<button class="btn ghost back" id="rBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>All recipes</button>
  <div class="rhead"><div class="stage" id="rArt"></div>
   <div><p class="eyebrow">${esc(r.cuisine)} · ${esc(r.level)}</p><h1>${esc(r.name)}</h1><p class="lede">${esc(r.blurb)}</p>
    <dl class="facts"><div><dt>Total</dt><dd>${dur(total(r))}</dd></div><div><dt>Prep</dt><dd>${dur(prep)}</dd></div><div><dt>Cook</dt><dd>${dur(cook)||'None'}</dd></div><div><dt>Steps</dt><dd>${r.steps.length}</dd></div></dl>
    <button class="btn primary big" id="startBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>Start cooking</button></div></div>
  <div class="rbody">
   <section class="panel"><div class="panel-h"><h2>Ingredients</h2><div class="stepper"><button id="sDown" aria-label="Fewer servings">−</button><output id="sOut">${st.serv} servings</output><button id="sUp" aria-label="More servings">+</button></div></div>
    <ul class="ing" id="ingList"></ul></section>
   <section class="panel overview"><h2>What you’ll need</h2><ul class="equip" style="margin-top:12px">${r.equip.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>
    <h2>The steps</h2>${phases.map(p=>{const ss=r.steps.map((s,i)=>({s,i})).filter(x=>x.s.p===p);return `<h3><span>${PHASE[p]}</span><span>${dur(ss.reduce((a,x)=>a+x.s.s,0))}</span></h3><ol>${ss.map(x=>`<li><span class="num">${String(x.i+1).padStart(2,'0')}</span><span>${esc(x.s.t)}</span><span class="dur">${x.s.s?clock(x.s.s):'—'}</span></li>`).join('')}</ol>`}).join('')}</section>
  </div>`;
  renderIng();
  $('#rBack').onclick=()=>show('home');
  $('#startBtn').onclick=()=>startCook();
  $('#sDown').onclick=()=>{if(st.serv>1){st.serv--;renderIng()}};
  $('#sUp').onclick=()=>{if(st.serv<16){st.serv++;renderIng()}};
}
function renderIng(){$('#sOut').textContent=st.serv+(st.serv===1?' serving':' servings');
  $('#ingList').innerHTML=st.r.ing.map((g,i)=>`<li><label><input type="checkbox" id="ing${i}" ${st.checked.has(i)?'checked':''}><span class="q">${fmtQty(g[0],g[1])}</span><span class="n">${esc(g[2])}${g[3]?` <small>${esc(g[3])}</small>`:''}</span></label></li>`).join('');
  $('#ingList').querySelectorAll('input').forEach((c,i)=>c.onchange=()=>{c.checked?st.checked.add(i):st.checked.delete(i)})}

/* ================= COOK MODE ================= */
let wake=null,tickId=null,actx=null;
function reqWake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}}
function chime(){try{if(!actx)return;const t=actx.currentTime;[880,1175,1568,1175,1568].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;const s=t+i*.2;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.22,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.8);o.connect(g).connect(actx.destination);o.start(s);o.stop(s+.85)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4200)}

function startCook(){unlockAudio();st.i=0;st.timers={};show('cook');reqWake();buildCook();renderStep(true);
  clearInterval(tickId);tickId=setInterval(tick,250)}
function leaveCook(){clearInterval(tickId);tickId=null;clearAdv();st.timers={}}
function buildCook(){const r=st.r;$('#ckName').textContent=r.name;
  const groups=[];r.steps.forEach((s,i)=>{const g=groups[groups.length-1];if(g&&g.p===s.p)g.ids.push(i);else groups.push({p:s.p,ids:[i]})});
  $('#prog').innerHTML=groups.map(g=>`<div class="prog-g ph-${g.p}" style="flex:${g.ids.length}" data-p="${g.p}"><small>${PHASE[g.p]}</small><div class="prog-s">${g.ids.map(i=>`<i data-i="${i}"></i>`).join('')}</div></div>`).join('');
  $('#rail').innerHTML=r.steps.map((s,i)=>`<li data-i="${i}"><button><span class="n">${i+1}</span><span class="t">${esc(s.t)}</span><span class="tm">${s.s?clock(s.s):''}</span></button></li>`).join('');
  $('#rail').querySelectorAll('li').forEach(li=>li.querySelector('button').onclick=()=>go(+li.dataset.i));}
function T(i){const s=st.r.steps[i];if(!s.s)return null;return st.timers[i]||(st.timers[i]={total:s.s,left:s.s,run:false,end:0,done:false})}
function renderStep(first){const r=st.r,i=st.i,s=r.steps[i];clearAdv();
  $('#ckCount').textContent=`Step ${i+1} of ${r.steps.length} · ${PHASE[s.p]}`;
  $('#prog').querySelectorAll('i').forEach(el=>{const k=+el.dataset.i;el.className=k<i?'done':k===i?'cur':''});
  $('#prog').querySelectorAll('.prog-g').forEach(g=>g.classList.toggle('on',g.dataset.p===s.p));
  stopStage&&stopStage();stopStage=renderScene($('#stage'),s.v);
  const cap=s.cap||(s.v.k==='stove'?HEAT[s.v.heat||'med'][0]+' heat':'');$('#stageCap').textContent=cap;
  const card=$('#stepCard');card.className='step-card ph-'+s.p;
  card.innerHTML=`<span class="pill">${PHASE[s.p]} · ${String(i+1).padStart(2,'0')}</span><h2>${esc(s.t)}</h2><p class="d">${esc(s.d)}</p>${s.tip?`<div class="tip"><b>Tip</b>${esc(s.tip)}</div>`:''}`;
  if(!first){void card.offsetWidth;card.classList.add('enter')}
  $('#nextBtn').textContent=i===r.steps.length-1?'Finish':'Done, next step';
  $('#prevBtn').disabled=i===0;
  renderTimer();updateRail(true);}
function renderTimer(){const t=T(st.i),el=$('#timer');
  if(!t){el.className='timer none';el.innerHTML=`<p class="t-status" style="margin:0"><b>No timer for this step.</b> Take your time, then tap <b>${st.i===st.r.steps.length-1?'Finish':'Done'}</b>.</p>`;return}
  el.innerHTML=`<div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="ringFg" cx="60" cy="60" r="52" stroke-dasharray="326.73" stroke-dashoffset="0"/></svg><div class="ring-read"><b id="tNum"></b><small id="tOf">of ${clock(t.total)}</small></div></div>
   <div class="t-side"><p class="t-status" id="tStatus"></p><div class="t-btns"><button class="btn primary" id="tGo"></button><button class="btn" id="tAdd">+30 s</button><button class="btn" id="tReset">Reset</button></div></div>`;
  $('#tGo').onclick=()=>toggleTimer();
  $('#tAdd').onclick=()=>{const t=T(st.i);if(t.run)t.end+=30000;else t.left+=30;t.total+=30;t.done=false;clearAdv();paintTimer()};
  $('#tReset').onclick=()=>{const t=T(st.i);t.run=false;t.done=false;t.total=st.r.steps[st.i].s;t.left=t.total;clearAdv();paintTimer();updateRail()};
  paintTimer()}
function toggleTimer(){const t=T(st.i);if(!t)return;unlockAudio();
  if(t.done){t.left=t.total;t.done=false}
  if(t.run){t.left=Math.max(0,(t.end-Date.now())/1000);t.run=false}else{t.end=Date.now()+t.left*1000;t.run=true}
  clearAdv();paintTimer();updateRail()}
function paintTimer(){const t=T(st.i);if(!t||!$('#tNum'))return;const el=$('#timer');
  const left=t.run?Math.max(0,(t.end-Date.now())/1000):t.left;
  $('#tNum').textContent=clock(left);$('#tOf').textContent='of '+clock(t.total);
  $('#ringFg').style.strokeDashoffset=(326.73*(1-left/t.total)).toFixed(1);
  el.className='timer'+(t.run?' running':'')+(t.done?' done':'');
  const go=$('#tGo');
  if(t.done){go.textContent='Restart';$('#tStatus').innerHTML=st.adv?`<b>Time’s up.</b> Next step in ${st.adv.n} s. <button class="btn ghost" id="stay" style="min-height:0;padding:2px 6px;text-decoration:underline">Stay here</button>`:'<b>Time’s up.</b> Tap Done when you’re ready.';const b=$('#stay');if(b)b.onclick=()=>{clearAdv();paintTimer()}}
  else if(t.run){go.textContent='Pause';$('#tStatus').innerHTML='<b>Running.</b> You can move on; it keeps counting.'}
  else if(t.left<t.total){go.textContent='Resume';$('#tStatus').innerHTML='<b>Paused.</b>'}
  else{go.textContent='Start timer';$('#tStatus').innerHTML=`This takes about <b>${dur(t.total)}</b>.`}}
function tick(){const now=Date.now();
  for(const k in st.timers){const t=st.timers[k];if(t.run&&now>=t.end){t.run=false;t.left=0;t.done=true;chime();const i=+k;
    if(i===st.i){if($('#autoAdv').checked&&i<st.r.steps.length-1)startAdv()}else toast(`Timer done: ${st.r.steps[i].t}`)}}
  paintTimer();updateRail()}
function startAdv(){clearAdv();st.adv={n:5,id:setInterval(()=>{st.adv.n--;if(st.adv.n<=0){clearAdv();go(st.i+1)}else paintTimer()},1000)};paintTimer()}
function clearAdv(){if(st.adv){clearInterval(st.adv.id);st.adv=null}}
function updateRail(scroll){const rail=$('#rail');if(!rail)return;
  rail.querySelectorAll('li').forEach(li=>{const k=+li.dataset.i,t=st.timers[k];li.className=(k<st.i?'done':k===st.i?'cur':'')+(t&&t.run?' run':'');
    const tm=li.querySelector('.tm');if(t)tm.textContent=t.done?'done':clock(t.run?(t.end-Date.now())/1000:t.left)});
  if(scroll&&rail.scrollHeight>rail.clientHeight+4){const cur=rail.querySelector('li.cur');if(cur)rail.scrollTop=Math.max(0,cur.offsetTop-rail.offsetTop-8)}}
function go(i){if(i<0)return;if(i>=st.r.steps.length){finish();return}st.i=i;renderStep(false);
  if(innerWidth<760)$('#stage').scrollIntoView({block:'start',behavior:reduced?'auto':'smooth'})}
$('#nextBtn').onclick=()=>go(st.i+1);
$('#prevBtn').onclick=()=>go(st.i-1);
$('#exitCook').onclick=()=>{leaveCook();openRecipe(st.r.id)};
document.addEventListener('keydown',e=>{if($('#cook').hidden||e.target.matches('input,textarea'))return;
  if(e.key==='ArrowRight'){e.preventDefault();go(st.i+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(st.i-1)}
  else if(e.key===' '&&!e.target.closest('button')){e.preventDefault();toggleTimer()}else if(e.key==='Escape'){leaveCook();openRecipe(st.r.id)}});
function finish(){const r=st.r;leaveCook();show('done');
  $('#done').innerHTML=`<div class="done-wrap"><div class="stage" id="doneArt"></div><div><p class="eyebrow">All ${r.steps.length} steps done</p><h1>Your ${esc(r.name)} is ready.</h1><p>Enjoy it. When you’re ready for the next one, search for something new.</p><div class="row"><button class="btn primary big" id="dNew">Cook something else</button><button class="btn big" id="dBack">Back to recipe</button></div></div></div>`;
  stopDone=renderScene($('#doneArt'),r.steps[r.steps.length-1].v);
  $('#dNew').onclick=()=>{show('home');q.value='';q.focus()};$('#dBack').onclick=()=>openRecipe(r.id)}

show('home');
</script>
